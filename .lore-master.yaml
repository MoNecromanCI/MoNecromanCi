# LoreMaster configuration. Commit this file; it never holds a secret
# (the editor keeps credentials in its own secret store).
# Generators (test-results, go-docs, openapi-docs) write Markdown into the workspace from
# other project artifacts; see docs/generators.md. Planned, accepted later: custom
# templates (#97).
version: 1
outputs:
  - platform: github-pages
    baseUrl: ""
    space: ""
    parentPageId: ""
    titlePrefix: ""
    direction: to-platform
    content:
      - type: markdown
        roots:
          - .
        template: default
    mermaidMode: ""
    titleCollision: ""
    linkMode: ""
    repo: https://github.com/MoNecromanCI/MoNecromanCi
    branch: gh-pages
