name: CI

# Generated by MoNecromanCI. Deliberately thin: Nx builds, 'nx release'
# versions from conventional commits and pushes ONLY a tag to main, and each
# app is packed into dist/drop/<type>-<name>.zip by its own 'package' target.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      sections:
        description: 'Run only these e2e sections on Windows (comma-separated labels, e.g. "node esm apps,dev up"). Empty runs all of them.'
        required: false
        default: ''
  # Nightly, purely so the e2e suite cannot rot unnoticed. It had been red since
  # #92 — eight PRs — because a manual trigger is the only thing that ever ran it,
  # and nobody thinks to run it. This caps the blind window at one day.
  #
  # Safe to add ONLY because the release steps below are gated on
  # `event_name == 'push'`. Under the older `!= 'pull_request'` form, a scheduled
  # run on main would have matched and started publishing packages nightly.
  schedule:
    - cron: '0 3 * * *'

concurrency:
  # One run at a time per ref, but `cancel-in-progress` is an expression on
  # purpose rather than a flat `true`. A superseded PR run is pure waste, so
  # cancel it — but a run on main publishes packages and pushes release tags, and
  # killing it part-way can leave a tag pushed with the publish only half done, a
  # state no rerun repairs cleanly. Those runs queue instead, which also stops two
  # `nx release` invocations racing to create the same tag.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  # Lets the release step push the version tag nx release creates back to main.
  contents: write
  # Lets azure/login exchange this job's OIDC token for a Microsoft Entra ID one,
  # which is how the VS Code extension reaches the Marketplace with no stored secret.
  # A token minted on a pull request cannot use it: the federated credential is
  # pinned to refs/heads/main.
  id-token: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Version resolution needs the release tags.
      - run: git fetch --all --prune --tags
        name: Fetch branches and release tags

      - run: git config user.name "github-actions[bot]" && git config user.email "github-actions[bot]@users.noreply.github.com"
        name: Set the git identity used for release tags

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # Caches ~/.npm keyed on package-lock.json, so `npm ci` restores from
          # the local cache instead of re-downloading every tarball each run.
          cache: npm

      # setup-node installs whatever npm the Node image bundles, and npm's major
      # is part of the contract: npm 11 reuses an already-installed tree instead
      # of re-resolving, so it applies `overrides` differently from npm 10. See
      # NPM_VERSION's remarks for the measurement.
      - run: npm install -g npm@11
        name: Pin npm to the major mnci verifies against

      - run: npm ci
        name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # This repo ships the CLI that every pipeline phase below runs, so it builds the
      # CLI from source first and calls it by path. A generated workspace instead
      # depends on @mnci/cli and writes `npx mnci ci <phase>`; pipeline-drift.integration.spec.ts
      # maps one onto the other.
      - run: npx nx build @mnci/cli
        name: Build the mnci CLI the phases below run

      # Installs the Python, Go and Flutter toolchains this workspace has projects
      # for, and does nothing for the rest.
      - run: node packages/cli/dist/cli.js ci setup
        name: Set up the language toolchains (Python, Go, Flutter)

      # Fails ONLY on an advisory that has a published fix, at moderate or
      # above; anything upstream has not fixed is printed and passes. pip-audit
      # is reported without failing.
      - run: node packages/cli/dist/cli.js ci audit
        name: Audit dependencies (fails on an actionable npm advisory)

      # The workspace sync check, then affected projects on a pull request and
      # EVERY project on anything else (a push to main included, so a release is
      # always verified in full). Every fallback takes the full path, because a run
      # that verifies too little still reports green. 'typecheck' is load-bearing
      # and not covered by 'build': @mnci/cli builds with tsup (esbuild), which
      # strips types without reading them.
      - run: node packages/cli/dist/cli.js ci verify
        name: Verify (sync check, then affected on a PR, every project on main)

      # Artifact gates. These verify the BUILT package, which nothing above does:
      # lint/typecheck/test all read src, and the type tests import from ../../src,
      # so a defect that exists only in the build output is invisible to every one
      # of them. They run unconditionally rather than only on main: a broken
      # published artifact is exactly the thing a PR should catch.
      - run: npx nx build @mnci/az-durable && npm run check:entrypoints -w @mnci/az-durable && npm run check:consumer -w @mnci/az-durable
        name: Verify the built package is consumable (entry points exist AND typecheck)

      # Packs every app into dist/drop/<type>-<name>.zip; skips cleanly with no apps.
      - run: node packages/cli/dist/cli.js ci pack
        name: Pack all apps (one zip per app -> dist/drop)
        if: ${{ github.event_name == 'push' && github.ref_name == 'main' }}

      - uses: actions/upload-artifact@v7
        if: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
        with:
          name: drop
          path: dist/drop
          if-no-files-found: ignore

      # Signs in to Microsoft Entra ID as the Marketplace publishing identity (an app
      # registration with a federated credential for this repository's main branch), so
      # the release publishes apps/mnci with 'vsce publish --azure-credential' and no
      # token. Runs only when the AZURE_CLIENT_ID and AZURE_TENANT_ID repository
      # variables exist. No Azure subscription is needed.
      - uses: azure/login@v3
        name: Sign in to Microsoft Entra ID (VS Code Marketplace)
        if: ${{ github.event_name == 'push' && github.ref_name == 'main' && vars.AZURE_CLIENT_ID != '' && hashFiles('apps/*/.vscodeignore') != '' }}
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # The whole release, as one phase: a full-checkout check, the npm and PyPI
      # preflights (so a rejected token is found BEFORE anything is tagged), the
      # RELEASE_SPECIFIER check, `nx release`, then the tag push. This repo's nx.json
      # leaves release.git.push off, so the phase pushes the tags itself.
      #
      # RELEASE_SPECIFIER (repository variable, Settings -> Secrets and variables ->
      # Actions -> Variables) overrides the bump nx would compute from conventional
      # commits for THIS run: 'major', 'minor', 'patch', or an exact version
      # ('1.2.3'). With more than one releasable package a bare keyword is unreliable
      # (nx versions interdependent packages in two passes, and the second computes
      # from a version cached before the first), so the phase refuses it; prefer an
      # exact version, and unset the variable once the override is no longer needed.
      - run: node packages/cli/dist/cli.js ci release
        name: Release — version, tag, publish and GitHub Release (npm + Python + C# + VS Code)
        if: ${{ github.event_name == 'push' && github.ref_name == 'main' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
          RELEASE_SPECIFIER: ${{ vars.RELEASE_SPECIFIER }}
          # The extension publishes with Entra ID when the sign-in step above ran
          # (VSCE_AUTH=entra), else with the VSCE_PAT token; tools/vscode-extension.cjs
          # skips the Marketplace with neither.
          VSCE_AUTH: ${{ vars.AZURE_CLIENT_ID != '' && 'entra' || '' }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

  # Real, empirical proof that mnci works on Windows, not just a static code
  # review: builds the CLI and runs the actual e2e suite (real `mnci new`/
  # `add`, real npm/pip installs, real zip packaging) on a genuine
  # windows-latest runner. Independent of the `ci` job above — never touches
  # release/tags, so it carries zero risk to the release pipeline and can run
  # in parallel. windows-latest has no python3.exe (only python.exe), so this
  # is exactly the environment that would have caught the python3-hard-coded
  # bug fixed in PR #55 before it shipped.
  #
  # Never on a push or PR: the real e2e runs ~25-30 minutes on windows-latest,
  # which is too slow to gate every commit for a check that only matters when
  # Windows-sensitive code (the cross-platform guard scripts, path handling,
  # `python`/`python3` resolution) changes.
  #
  # But manual-only was worse than it looked: nothing ran it, so it sat red for
  # eight PRs. It now also runs on the nightly schedule, which costs one 30-minute
  # job a day and means a break is noticed within a day instead of whenever
  # somebody next remembers.
  e2e-windows:
    name: e2e (windows-latest)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    runs-on: windows-latest
    # A full run takes about an hour and a half; this caps a stuck one well before the six-hour default, and a push
    # to main that needs a release run is queued behind it meanwhile.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # Caches ~/.npm keyed on package-lock.json, so `npm ci` restores from
          # the local cache instead of re-downloading every tarball each run.
          cache: npm

      # setup-node installs whatever npm the Node image bundles, and npm's major
      # is part of the contract: npm 11 reuses an already-installed tree instead
      # of re-resolving, so it applies `overrides` differently from npm 10. See
      # NPM_VERSION's remarks for the measurement.
      - run: npm install -g npm@11
        name: Pin npm to the major mnci verifies against

      - run: npm ci
        name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The Go and Flutter toolchains, provisioned UNCONDITIONALLY — which is the
      # whole point, and why these are not the `ci` job's guards.
      #
      # Every guard in the `ci` job is gated on `existsSync('go.mod')` /
      # `existsSync('pubspec.yaml')` in the working directory. This job's working
      # directory is *this repo*, which has neither: the e2e generates its
      # workspaces in a temp directory and drives them from there. So the gated
      # guards would skip here every time, which is exactly what had been
      # happening — the suite reported `SKIPPED the go lint assertion` and
      # `SKIPPED the entire Flutter section` on every run, so `@mnci/nx-flutter`
      # (a first-party, published plugin) had NEVER been exercised in CI.
      #
      # `continue-on-error` on both installs is deliberate. The e2e already treats
      # an absent toolchain as a loud SKIPPED in its final report, so a flaky SDK
      # download degrades to the behaviour we have today rather than turning the
      # nightly red for something that is not mnci's fault. A silent pass is not
      # possible: the report names every skipped section.
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
        name: Install golangci-lint (so the e2e's Go lint assertion runs)
        continue-on-error: true

      - run: node -e "const cp=require('node:child_process'),fs=require('node:fs'),path=require('node:path');const r=cp.spawnSync('go',['env','GOPATH'],{encoding:'utf8'});if(r.status!==0){console.log('Could not read GOPATH - skipping.');process.exit(0)}fs.appendFileSync(process.env.GITHUB_PATH,path.join(r.stdout.trim(),'bin')+require('node:os').EOL)"
        name: Add Go tool bin to PATH
        continue-on-error: true

      - run: node -e "const cp=require('node:child_process'),fs=require('node:fs'),path=require('node:path'),os=require('node:os');const sdk=path.join(os.homedir(),'.mnci-flutter-3.44.8');if(fs.existsSync(sdk)){console.log('Flutter SDK already at '+sdk+' - skipping.');process.exit(0)}process.exit(cp.spawnSync('git',['clone','--depth','1','--branch','3.44.8','https://github.com/flutter/flutter.git',sdk],{stdio:'inherit'}).status ?? 1)"
        name: Install the Flutter SDK (3.44.8, so the e2e's Flutter section runs)
        continue-on-error: true

      - run: node -e "const fs=require('node:fs'),path=require('node:path'),os=require('node:os');const bin=path.join(os.homedir(),'.mnci-flutter-3.44.8','bin');if(!fs.existsSync(bin)){console.log('No Flutter SDK to publish - skipping.');process.exit(0)}fs.appendFileSync(process.env.GITHUB_PATH,bin+os.EOL)"
        name: Add the Flutter SDK to PATH
        continue-on-error: true

      # The .NET SDK, provisioned UNCONDITIONALLY — same reasoning as Go and
      # Flutter above. The `ci` job's own install step (githubActionsYaml's
      # actions/setup-dotnet) is gated on `hashFiles('**/*.csproj') != ''`,
      # which this job's working directory (this repo, not a generated
      # workspace) never satisfies — so without this, the e2e's C# section
      # would report `SKIPPED the entire C# section` on every run, the exact
      # gap Go and Flutter already had before the block above existed.
      - uses: actions/setup-dotnet@v6
        name: Install the .NET SDK (10.0.x, so the e2e's C# section runs)
        continue-on-error: true
        with:
          dotnet-version: 10.0.x

      - run: npx nx build @mnci/cli
        name: Build @mnci/cli

      - run: node packages/cli/e2e/cli.e2e.mjs
        name: Run the real e2e suite (mnci new/add, real npm/pip installs and zip packaging)
        env:
          # Set only by a manual dispatch that names sections; empty means every section.
          MNCI_E2E_ONLY: ${{ github.event.inputs.sections }}

  # The container images, on Linux. They are Linux images: a Windows runner cannot run them, and a developer
  # machine may have no Docker engine running, so this is where `mnci add container` is proven for real. It runs
  # only the one e2e section that needs a Docker engine, the same cadence as the Windows e2e (nightly and on
  # demand), so a PR does not wait for it.
  e2e-containers:
    name: e2e (container images)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm install -g npm@11
        name: Pin npm to the major mnci verifies against

      - run: npm ci
        name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # The Go app's image is built from a binary `go build` produces, so the toolchain is needed here too.
      - uses: actions/setup-go@v6
        name: Install Go (so the Go app's image is built)
        continue-on-error: true
        with:
          go-version: stable

      - run: npx nx build @mnci/cli
        name: Build @mnci/cli

      - run: node packages/cli/e2e/cli.e2e.mjs
        name: Build and run the container images
        env:
          MNCI_E2E_ONLY: container images
