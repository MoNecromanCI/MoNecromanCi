name: Dependabot lockfile

# Generated by MoNecromanCI. Completes package-lock.json on a Dependabot pull request with the npm
# this workspace pins (npm 12), so `npm ci` in CI does not stop on "Missing ... from lock file".
#
# Needs a Dependabot secret named LOCKFILE_TOKEN, a token that can push to this repository
# (a fine-grained token with Contents and Pull requests write). A push made with the workflow's
# own token starts no CI run, which is why this is a separate token. Set it with:
#   gh secret set LOCKFILE_TOKEN --app dependabot
# Without it the job only says so.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lockfile:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - id: token
        name: Check that LOCKFILE_TOKEN is set
        env:
          LOCKFILE_TOKEN: ${{ secrets.LOCKFILE_TOKEN }}
        run: |
          if [ -z "$LOCKFILE_TOKEN" ]; then
            echo "::notice title=Dependabot lockfile::LOCKFILE_TOKEN is not set as a Dependabot secret, so this job does nothing. See the comment at the top of this file."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.LOCKFILE_TOKEN }}

      - if: steps.token.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - if: steps.token.outputs.present == 'true'
        run: npx --yes npm@12 install --package-lock-only --ignore-scripts
        name: Complete the lockfile with the pinned npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - if: steps.token.outputs.present == 'true'
        name: Push the lockfile when it changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already complete."
            exit 0
          fi
          git config user.name "mnci lockfile bot"
          git config user.email "noreply@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build(deps): complete package-lock.json with npm 12"
          git push
