# One-off. Prints the Marketplace user id of the Entra identity the release logs in as.
#
# The Marketplace "Members > Add" box wants that id, and it cannot be looked up by name:
# it is the `id` the Visual Studio profile API returns for the signed-in identity. The
# identity can only authenticate through its federated credential, from a workflow, so this
# runs there. Delete this file once the identity is a member of the publisher.
name: Marketplace identity (one-off)

on: workflow_dispatch

permissions:
  id-token: write
  contents: read

jobs:
  whoami:
    runs-on: ubuntu-latest
    steps:
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Ask the profile API who this identity is
        run: |
          # 499b84ac-... is the Azure DevOps resource, which the Marketplace trusts.
          token=$(az account get-access-token --resource 499b84ac-1321-427f-aa17-267ca6975798 --query accessToken --output tsv)
          curl --fail --silent --show-error \
            --header "Authorization: Bearer ${token}" \
            "https://app.vssps.visualstudio.com/_apis/profile/profiles/me?api-version=6.0" \
            | jq '{id, displayName, publicAlias}'
